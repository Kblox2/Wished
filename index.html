<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #f9fafb;
        }

        .calculator {
            width: min(92vw, 360px);
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .display {
            width: 100%;
            min-height: 84px;
            background: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 14px;
            margin-bottom: 18px;
            padding: 16px 14px;
            text-align: right;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            font-size: clamp(2rem, 5vw, 2.7rem);
            font-weight: 700;
            overflow: hidden;
            word-break: break-all;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 14px;
            min-height: 64px;
            font-size: 1.35rem;
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.12s ease;
            font-weight: 700;
        }

        button:hover {
            opacity: 0.96;
        }

        button:active {
            transform: scale(0.98);
        }

        .operator {
            background: #f59e0b;
            color: #111827;
        }

        .action {
            background: #374151;
            color: #f9fafb;
        }

        .digit {
            background: #e5e7eb;
            color: #111827;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons">
            <button class="action" data-action="clear">C</button>
            <button class="action" data-action="delete">DEL</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>

            <button class="digit" data-value="7">7</button>
            <button class="digit" data-value="8">8</button>
            <button class="digit" data-value="9">9</button>
            <button class="operator" data-value="-">−</button>

            <button class="digit" data-value="4">4</button>
            <button class="digit" data-value="5">5</button>
            <button class="digit" data-value="6">6</button>
            <button class="operator" data-value="+">+</button>

            <button class="digit" data-value="1">1</button>
            <button class="digit" data-value="2">2</button>
            <button class="digit" data-value="3">3</button>
            <button class="operator" data-action="equals">=</button>

            <button class="digit zero" data-value="0">0</button>
            <button class="digit" data-value=".">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('button');
        let currentValue = '0';

        function updateDisplay(value) {
            display.textContent = value;
        }

        function appendValue(value) {
            if (currentValue === '0' && value !== '.') {
                currentValue = value;
            } else if (value === '.' && currentValue.includes('.')) {
                return;
            } else {
                currentValue += value;
            }
            updateDisplay(currentValue);
        }

        function deleteLast() {
            if (currentValue.length <= 1) {
                currentValue = '0';
            } else {
                currentValue = currentValue.slice(0, -1);
            }
            updateDisplay(currentValue);
        }

        function clearAll() {
            currentValue = '0';
            updateDisplay(currentValue);
        }

        function calculateExpression(expression) {
            const sanitized = expression
                .replace(/×/g, '*')
                .replace(/÷/g, '/');

            if (!/^[0-9+\-*/.() ]+$/.test(sanitized)) {
                return 'Error';
            }

            try {
                const result = Function(`"use strict"; return (${sanitized})`)();
                return Number.isFinite(result) ? String(result) : 'Error';
            } catch {
                return 'Error';
            }
        }

        buttons.forEach((button) => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                const value = button.dataset.value;

                if (action === 'clear') {
                    clearAll();
                    return;
                }

                if (action === 'delete') {
                    deleteLast();
                    return;
                }

                if (action === 'equals') {
                    const result = calculateExpression(currentValue);
                    currentValue = result === 'Error' ? 'Error' : result;
                    updateDisplay(currentValue);
                    return;
                }

                if (value) {
                    appendValue(value);
                }
            });
        });

        document.addEventListener('keydown', (event) => {
            const { key } = event;

            if (/^[0-9]$/.test(key)) {
                appendValue(key);
            } else if (['+', '-', '*', '/'].includes(key)) {
                appendValue(key);
            } else if (key === '.') {
                appendValue('.');
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Enter' || key === '=') {
                const result = calculateExpression(currentValue);
                currentValue = result === 'Error' ? 'Error' : result;
                updateDisplay(currentValue);
            }
        });
    </script>
</body>
</html>
