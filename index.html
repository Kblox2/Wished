<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image-to-3D Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Image-to-3D Studio</span>
        </div>
        <div class="header-badges">
          <span class="badge">Depth map</span>
          <span class="badge">GLB / OBJ / FBX</span>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="card">
            <h3>Upload image</h3>
            <div class="upload-area">
              <input id="imageUpload" type="file" accept="image/*" />
              <div class="upload-copy">
                <strong>Choose a photo</strong>
                JPG, PNG, or WEBP
              </div>
            </div>
            <div id="fileName" class="file-meta">No file selected</div>
          </div>

          <div class="card">
            <h3>Mesh settings</h3>
            <div class="control-group">
              <label for="depthStrength">Depth strength</label>
              <input id="depthStrength" type="range" min="0.5" max="3.5" step="0.1" value="1.8" />
              <div class="range-label">
                <span>Low</span>
                <span id="depthValue">1.8x</span>
                <span>High</span>
              </div>
            </div>
          </div>

          <div class="card">
            <h3>Generate model</h3>
            <button id="generateBtn" class="primary-btn">Generate 3D mesh</button>
            <button id="clearBtn" class="secondary-btn" style="margin-top: 10px;">Clear</button>
          </div>

          <div class="card">
            <h3>Download</h3>
            <div class="download-grid">
              <button class="download-btn" data-format="glb" disabled>GLB</button>
              <button class="download-btn" data-format="obj" disabled>OBJ</button>
              <button class="download-btn" data-format="fbx" disabled>FBX</button>
            </div>
          </div>
        </aside>

        <main class="viewer-panel">
          <div class="viewer-box">
            <canvas id="viewer"></canvas>
          </div>

          <div class="preview-strip">
            <img id="previewImage" class="preview-thumb hidden" alt="Uploaded preview" />
            <div id="status" class="status">Upload a photo to generate a 3D surface mesh.</div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/examples/js/exporters/OBJExporter.js"></script>
    <script src="app.js"></script>
  </body>
</html>
